<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="React Tunes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="msapplication-navbutton-color" content="#0a0a0a" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="description" content="Reproductor de música estilo streaming premium para iPhone" />
    <title>React Tunes</title>
    
    <!-- Manifest para PWA -->
    <link rel="manifest" href="./manifest.json" />
    
    <!-- Iconos para iOS -->
    <link rel="apple-touch-icon" href="./apple-icon-180.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png" />
    
    <!-- Splash screens para iOS -->
    <link rel="apple-touch-startup-image" href="./splash.png" />
    
    <!-- Fuentes Google: Inter & SF Pro Display fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0a0a;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    
    <!-- Registrar Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => {
              console.log('SW registrado:', registration.scope);
              registration.update();
            })
            .catch((error) => {
              console.log('Error al registrar SW:', error);
            });
        });
      }
    </script>
  </body>
</html>
